<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="按关键词权重筛选的期刊论文每日推荐。">
  <meta name="theme-color" content="#f4f0e8">
  <title>今日推荐 · Scholarly Tracker</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css?v=1.2.0">
  <script src="assets/app.js?v=1.2.0" defer></script>
</head>
<body data-page="today">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Scholarly Tracker 首页">
      <span class="brand-mark" aria-hidden="true">ST</span>
      <span><strong>Scholarly Tracker</strong><small>期刊追踪</small></span>
    </a>
    <nav aria-label="主导航">
      <a href="index.html" aria-current="page">今日推荐</a>
      <a href="history.html">历史</a>
      <a href="papers.html">全部论文</a>
      <a href="status.html">运行状态</a>
    </nav>
  </header>

  <main>
    <section class="today-header">
      <p class="eyebrow">今日更新</p>
      <h1 id="today-label">读取中</h1>
    </section>

    <section class="stat-cards" aria-label="今日摘要">
      <div class="stat-card"><span>本次更新</span><strong id="new-count">—</strong></div>
      <div class="stat-card"><span>今日推荐</span><strong id="recommend-count">—</strong></div>
    </section>

    <section class="content-section">
      <div class="section-heading">
        <div><p class="eyebrow">推荐文章</p><h2>今日推荐</h2></div>
      </div>
      <div id="today-list" class="paper-list" aria-live="polite">
        <div class="loading">正在读取今日论文…</div>
      </div>
    </section>

    <section class="content-section compact">
      <div class="section-heading">
        <div><p class="eyebrow">其余更新</p><h2>其余更新</h2></div>
      </div>
      <div id="other-list" class="paper-list" aria-live="polite">
        <div class="loading">正在读取其他新论文…</div>
      </div>
    </section>
  </main>

  <footer><span>Scholarly Tracker</span><span>RSS · Crossref · GitHub Pages</span></footer>
</body>
</html>
