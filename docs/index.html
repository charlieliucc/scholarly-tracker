<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="按标签权重筛选的期刊论文每日推荐。">
  <meta name="theme-color" content="#fafaf8">
  <title>今日推荐 · Scholarly Tracker</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="assets/style.css?v=1.26-20261003">
  <script src="assets/app.js?v=1.26-20261003" defer></script>
</head>
<body data-page="today">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Scholarly Tracker 首页">
      <span class="brand-mark" aria-hidden="true">ST</span>
      <span><strong>Scholarly Tracker</strong><small>期刊追踪</small></span>
    </a>
    <nav aria-label="主导航">
      <a href="index.html" aria-current="page">今日推荐</a>
      <a href="history.html">历史记录</a>
      <a href="https://github.com/charlieliucc/scholarly-tracker" target="_blank" rel="noopener noreferrer">我要定制</a>
    </nav>
  </header>

  <main>
    <section class="today-header">
      <h1 id="today-label">读取中</h1>
      <p id="content-updated" class="content-updated"></p>
      <div id="update-notice" class="update-notice" role="status" hidden></div>
    </section>

    <section class="stat-cards" aria-label="今日摘要">
      <div class="stat-card"><span>今日推荐</span><strong id="recommend-count">—</strong></div>
      <div class="stat-card"><span>本次更新</span><strong id="new-count">—</strong></div>
      <div class="stat-card"><span>近7天更新</span><strong id="seven-day-count">—</strong></div>
    </section>

    <section class="content-section">
      <div class="section-heading">
        <div><h2>今日推荐</h2></div>
      </div>
      <div id="today-list" class="paper-list" aria-live="polite">
        <div class="loading">正在读取今日论文…</div>
      </div>
    </section>

    <section class="content-section compact">
      <div class="section-heading">
        <div><h2>随便看看</h2></div><p>其他推荐</p>
      </div>
      <div id="other-list" class="paper-list" aria-live="polite">
        <div class="loading">正在读取其他新论文…</div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span id="site-copyright">© 2026 Charlieliucc</span>
    <div class="site-footer-stats">
      <span id="site-runtime">自 2026-08-31 运行</span>
      <span id="site-paper-count" title="累计所有运行记录，包含同一天重跑。">累计识别与推荐统计读取中…</span>
      <span class="site-version">v1.26-20261003</span>
      <a href="status.html">运行状态</a>
      <a href="https://github.com/charlieliucc" target="_blank" rel="noopener noreferrer">GitHub 主页</a>
    </div>
  </footer>
</body>
</html>
