<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Scholarly Tracker 的历史日更记录。">
  <meta name="theme-color" content="#fafaf8">
  <title>历史记录 · Scholarly Tracker</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css?v=1.3.2">
  <script src="assets/app.js?v=1.3.2" defer></script>
</head>
<body data-page="history">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Scholarly Tracker 首页">
      <span class="brand-mark" aria-hidden="true">ST</span>
      <span><strong>Scholarly Tracker</strong><small>期刊追踪</small></span>
    </a>
    <nav aria-label="主导航">
      <a href="index.html">今日推荐</a>
      <a href="history.html" aria-current="page">历史</a>
      <a href="status.html">运行状态</a>
      <a href="https://github.com/charlieliucc/scholarly-tracker" target="_blank" rel="noopener noreferrer">我要定制</a>
    </nav>
  </header>

  <main>
    <section class="page-title">
      <h1>历史记录</h1>
      <p>错过某一天的推送？选择日期查看最近 7 天的日更论文；更早内容可在邮箱中回溯。</p>
    </section>
    <section class="filters history-filters" aria-label="历史日期筛选">
      <label><span>日更日期</span><select id="history-date"></select></label>
    </section>
    <div class="result-meta"><span id="history-count">读取中…</span><span id="history-updated"></span></div>
    <section class="content-section history-section">
      <div class="section-heading">
        <div><h2>今日推荐</h2></div>
      </div>
      <div id="history-recommended-list" class="paper-list" aria-live="polite"><div class="loading">正在读取历史记录…</div></div>
    </section>
    <section class="content-section compact">
      <div class="section-heading">
        <div><h2>随便看看</h2></div><p>其他推荐</p>
      </div>
      <div id="history-other-list" class="paper-list" aria-live="polite"><div class="loading">正在读取历史记录…</div></div>
    </section>
  </main>

  <footer><span>Scholarly Tracker</span><span>每日期刊资讯</span></footer>
</body>
</html>
